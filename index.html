<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saidur R. Saimoon | Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  --bg:#05050d;--bg-2:#0a0a18;--surface:rgba(18,18,38,.55);
  --primary:#00d9ff;--secondary:#a855f7;--accent:#ff2e93;--gold:#fbbf24;
  --text:#eaeaf5;--muted:#8585a5;--border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.14);
}
body.light{
  --bg:#eef1f9;--bg-2:#e4e9f5;--surface:rgba(255,255,255,.75);
  --text:#0d0e1f;--muted:#5a5a78;--border:rgba(0,0,0,.07);
  --border-strong:rgba(0,0,0,.12);
}
body.light .bg-base{background:linear-gradient(135deg,#eef1f9,#e6ebff,#eef1f9)}
body.light nav{background:rgba(238,241,249,.7)}
body.light nav.scrolled{background:rgba(238,241,249,.95)}
body.light .orb{opacity:.35}
body.light .hero-floating-code span{color:rgba(0,0,0,.05)}
body.light .bg-grid{opacity:.4}
body.light .bg-noise{opacity:.03}

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);
  overflow-x:hidden;cursor:none;transition:background .5s,color .5s;
  line-height:1.65;min-height:100vh;
}
body.light{cursor:auto}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button{font-family:inherit}

/* ========== BACKGROUND ========== */
.bg-base{
  position:fixed;inset:0;z-index:-5;
  background:linear-gradient(135deg,#05050d,#0b0b1f,#05050d,#0f0f28);
  background-size:400% 400%;animation:bgShift 25s ease infinite;
}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.bg-grid{
  position:fixed;inset:0;z-index:-4;
  background-image:
    linear-gradient(rgba(0,217,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(168,85,247,.05) 1px,transparent 1px);
  background-size:60px 60px;
  mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);
  animation:gridMove 40s linear infinite;
}
@keyframes gridMove{0%{background-position:0 0,0 0}100%{background-position:60px 60px,60px 60px}}
.bg-noise{
  position:fixed;inset:0;z-index:-3;opacity:.06;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  pointer-events:none;animation:noiseShift .4s steps(4) infinite;
}
@keyframes noiseShift{0%,100%{transform:translate(0,0)}25%{transform:translate(-2%,2%)}50%{transform:translate(2%,-1%)}75%{transform:translate(-1%,-2%)}}
.orb{
  position:fixed;border-radius:50%;filter:blur(110px);
  opacity:.45;z-index:-2;pointer-events:none;
  animation:orbFloat 22s ease-in-out infinite;
}
.orb1{width:min(520px,75vw);height:min(520px,75vw);background:var(--primary);top:-180px;left:-140px}
.orb2{width:min(460px,65vw);height:min(460px,65vw);background:var(--secondary);bottom:-180px;right:-140px;animation-delay:-6s}
.orb3{width:min(400px,55vw);height:min(400px,55vw);background:var(--accent);top:35%;left:55%;animation-delay:-12s}
.orb4{width:min(300px,45vw);height:min(300px,45vw);background:var(--gold);bottom:35%;left:10%;animation-delay:-3s;opacity:.25}
.orb5{width:min(360px,50vw);height:min(360px,50vw);background:#3b82f6;top:15%;right:20%;animation-delay:-9s;opacity:.3}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(60px,-50px) scale(1.1)}
  50%{transform:translate(-40px,60px) scale(.95)}
  75%{transform:translate(50px,30px) scale(1.05)}
}
#particles{position:fixed;inset:0;z-index:-1;pointer-events:none}

/* ========== SCROLL PROGRESS ========== */
#scrollProgress{
  position:fixed;top:0;left:0;height:3px;width:0;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));
  z-index:9999;transition:width .08s linear;
  box-shadow:0 0 15px rgba(0,217,255,.6);
}

/* ========== PRELOADER ========== */
#preloader{
  position:fixed;inset:0;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;z-index:10000;
  transition:opacity .7s,visibility .7s;
}
#preloader.hide{opacity:0;visibility:hidden}
.pl-ring{width:130px;height:130px;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:30px}
.pl-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.pl-ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.pl-bg{stroke:rgba(255,255,255,.06)}
.pl-fg{
  stroke:var(--primary);stroke-dasharray:327;stroke-dashoffset:327;
  filter:drop-shadow(0 0 8px var(--primary));
  animation:plSpin 2s ease forwards;
}
@keyframes plSpin{to{stroke-dashoffset:0}}
.pl-counter{
  font-family:'Space Grotesk',sans-serif;font-size:1.6rem;font-weight:700;
  display:flex;align-items:baseline;gap:2px;
}
.pl-counter i{font-size:.9rem;color:var(--muted);font-style:normal}
.pl-logo{
  font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;
  letter-spacing:3px;margin-bottom:10px;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));
  background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradShift 2s linear infinite;
}
.pl-logo span{color:var(--accent);-webkit-text-fill-color:var(--accent)}
.pl-text{color:var(--muted);font-size:.72rem;letter-spacing:4px;text-transform:uppercase;animation:blinkFade 1.6s ease infinite}
@keyframes blinkFade{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes gradShift{0%{background-position:0% center}100%{background-position:200% center}}

/* ========== CURSOR ========== */
.cursor-dot,.cursor-ring,.cursor-trail{
  position:fixed;top:0;left:0;pointer-events:none;
  transform:translate(-50%,-50%);z-index:9998;will-change:transform;
}
.cursor-dot{
  width:6px;height:6px;background:var(--primary);border-radius:50%;
  box-shadow:0 0 15px var(--primary);
  transition:width .25s,height .25s;z-index:9999;
}
.cursor-ring{
  width:36px;height:36px;border:1.5px solid rgba(0,217,255,.5);
  border-radius:50%;transition:width .3s,height .3s,border-color .3s,background .3s;
}
.cursor-trail{width:8px;height:8px;border-radius:50%;background:var(--secondary);filter:blur(2px)}
#trail1{opacity:.5}#trail2{opacity:.4}#trail3{opacity:.3}#trail4{opacity:.2}#trail5{opacity:.12}

/* ========== NAVBAR ========== */
nav{
  position:fixed;top:0;left:0;width:100%;padding:18px 60px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(5,5,13,.6);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);z-index:1000;transition:all .35s;
}
nav.scrolled{padding:12px 60px;background:rgba(5,5,13,.92)}
.logo{display:flex;align-items:center;gap:6px;font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem}
.logo-mark{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;align-items:center;justify-content:center;
  color:#000;font-size:1.15rem;font-weight:800;
  box-shadow:0 6px 20px rgba(0,217,255,.4);
  animation:logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{box-shadow:0 6px 20px rgba(0,217,255,.4)}50%{box-shadow:0 6px 30px rgba(168,85,247,.6)}}
.logo-text em{color:var(--accent);font-style:normal}
.nav-links{display:flex;list-style:none;gap:32px}
.nav-links a{
  font-size:.88rem;font-weight:500;color:var(--muted);
  position:relative;overflow:hidden;height:1.4em;display:inline-block;transition:color .3s;
}
.nav-links a span{display:block;transition:transform .4s cubic-bezier(.65,0,.35,1)}
.nav-links a::before{
  content:attr(data-text);position:absolute;top:100%;left:0;
  color:var(--primary);font-weight:600;
  transition:transform .4s cubic-bezier(.65,0,.35,1);
}
.nav-links a:hover span{transform:translateY(-100%)}
.nav-links a:hover::before{transform:translateY(-100%)}
.nav-right{display:flex;align-items:center;gap:12px}
#themeBtn{
  width:42px;height:42px;border-radius:50%;
  border:1px solid var(--border-strong);background:var(--surface);
  color:var(--primary);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;transition:all .4s;
}
#themeBtn i{position:absolute;font-size:.95rem;transition:transform .4s,opacity .4s}
#themeBtn .fa-sun{transform:translateY(0);opacity:1}
#themeBtn .fa-moon{transform:translateY(100%);opacity:0}
body.light #themeBtn .fa-sun{transform:translateY(-100%);opacity:0}
body.light #themeBtn .fa-moon{transform:translateY(0);opacity:1}
#themeBtn:hover{border-color:var(--primary);box-shadow:0 0 20px rgba(0,217,255,.35);transform:rotate(20deg)}
.menu-btn{
  display:none;width:42px;height:42px;
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:12px;cursor:pointer;padding:10px;
  flex-direction:column;justify-content:space-between;
}
.menu-btn span{display:block;height:2px;background:var(--primary);border-radius:2px;transition:transform .3s,opacity .3s}
.menu-btn.active span:nth-child(1){transform:translateY(8px) rotate(45deg)}
.menu-btn.active span:nth-child(2){opacity:0}
.menu-btn.active span:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

/* ========== HERO ========== */
.hero{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:140px 40px 100px;position:relative;overflow:hidden;
}
.hero-floating-code{
  position:absolute;inset:0;pointer-events:none;
  font-family:'JetBrains Mono',monospace;font-size:clamp(.7rem,1.4vw,.95rem);
}
.hero-floating-code span{
  position:absolute;color:rgba(255,255,255,.06);
  animation:codeFloat 8s ease-in-out infinite;letter-spacing:1px;
}
.hero-floating-code span:nth-child(1){top:22%;left:8%}
.hero-floating-code span:nth-child(2){top:65%;right:10%;animation-delay:-3s}
.hero-floating-code span:nth-child(3){bottom:18%;left:14%;animation-delay:-6s}
@keyframes codeFloat{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(15px,-25px) rotate(3deg)}}
.hero-inner{max-width:900px;text-align:center;position:relative;z-index:2}
.hero-badge{
  display:inline-flex;align-items:center;gap:10px;
  padding:9px 20px;background:var(--surface);
  border:1px solid var(--border-strong);border-radius:60px;
  font-size:.72rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--muted);margin-bottom:32px;
  opacity:0;animation:heroFade .8s .9s ease forwards;
}
@keyframes heroFade{to{opacity:1}}
.badge-pulse{
  width:7px;height:7px;border-radius:50%;background:#00ff88;
  box-shadow:0 0 12px #00ff88;animation:pulseDot 1.6s infinite;
}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.hero-name{
  font-family:'Syne',sans-serif;
  font-size:clamp(2.2rem,7.5vw,6rem);
  font-weight:800;line-height:.98;letter-spacing:-2px;margin-bottom:26px;
}
.hero-name .line{display:block;overflow:hidden;padding:0 5px}
.hero-name .word{display:inline-block}
.hero-name .letter{
  display:inline-block;opacity:0;
  transform:translateY(120%) rotateX(-80deg);
  transform-origin:50% 100%;
  animation:letterRise .9s cubic-bezier(.2,.9,.3,1.2) forwards;
}
@keyframes letterRise{
  0%{opacity:0;transform:translateY(120%) rotateX(-80deg)}
  100%{opacity:1;transform:translateY(0) rotateX(0)}
}
.hero-name .word.gradient .letter{
  background:linear-gradient(120deg,var(--primary),var(--secondary),var(--accent),var(--gold),var(--primary));
  background-size:400% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:letterRise .9s cubic-bezier(.2,.9,.3,1.2) forwards, gradShift 6s linear infinite;
}
.hero-name .space{display:inline-block;width:.35em}
.hero-role{
  display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(.85rem,2.1vw,1.05rem);
  color:var(--muted);margin-bottom:24px;
  padding:8px 20px;border-radius:50px;
  background:var(--surface);border:1px solid var(--border-strong);
  opacity:0;animation:heroFade .8s 1.5s ease forwards;
}
.role-bracket{color:var(--primary);font-weight:700}
#typingRole{color:var(--text);font-weight:600}
.role-cursor{
  display:inline-block;width:2px;height:1.1em;background:var(--primary);
  animation:caretBlink 1s step-end infinite;margin-left:2px;
}
@keyframes caretBlink{50%{opacity:0}}
.hero-desc{
  color:var(--muted);font-size:clamp(.9rem,1.9vw,1.02rem);
  max-width:600px;margin:0 auto 38px;line-height:1.75;
  opacity:0;animation:heroFade .8s 1.8s ease forwards;
}
.hero-desc strong{color:var(--text);font-weight:600}
.hero-actions{
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
  opacity:0;animation:heroFade .8s 2.1s ease forwards;
}
.btn{
  position:relative;display:inline-flex;align-items:center;justify-content:center;
  padding:15px 32px;border-radius:60px;font-weight:600;font-size:.9rem;
  cursor:pointer;border:none;overflow:hidden;
  transition:transform .35s cubic-bezier(.4,0,.2,1);will-change:transform;
}
.btn span{position:relative;z-index:2;display:inline-flex;align-items:center;gap:10px}
.btn-glow{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#000;box-shadow:0 10px 30px rgba(0,217,255,.35)}
.btn-glow::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--secondary),var(--accent));opacity:0;transition:opacity .4s}
.btn-glow:hover::before{opacity:1}
.btn-glow:hover{color:#fff;box-shadow:0 15px 40px rgba(168,85,247,.55)}
.btn-ghost{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}
.btn-ghost::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--primary),var(--secondary));opacity:0;transition:opacity .4s}
.btn-ghost:hover::before{opacity:1}
.btn-ghost:hover{color:#000;border-color:transparent;box-shadow:0 15px 40px rgba(0,217,255,.4)}
.hero-scroll{
  position:absolute;bottom:32px;left:50%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:12px;
  color:var(--muted);font-size:.68rem;letter-spacing:3px;text-transform:uppercase;
  opacity:0;animation:heroFade .8s 2.4s ease forwards;
}
.scroll-line{width:1px;height:50px;background:linear-gradient(180deg,var(--primary),transparent);position:relative;overflow:hidden}
.scroll-line::after{
  content:'';position:absolute;top:0;left:0;width:100%;height:20px;
  background:linear-gradient(180deg,transparent,var(--primary));
  animation:scrollDot 2s ease-in-out infinite;
}
@keyframes scrollDot{0%{transform:translateY(-100%)}100%{transform:translateY(300%)}}

/* ========== MARQUEE ========== */
.marquee{
  width:100%;overflow:hidden;padding:26px 0;
  background:rgba(255,255,255,.02);
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
}
.marquee-inner{display:flex;gap:60px;white-space:nowrap;animation:marqueeMove 28s linear infinite}
.marquee-item{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:clamp(1.2rem,3vw,2rem);letter-spacing:1px;
  background:linear-gradient(90deg,var(--primary),var(--secondary),var(--accent));
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradShift 4s linear infinite;
}
@keyframes marqueeMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ========== SECTIONS ========== */
.section{padding:120px 60px;position:relative}
.section-head{text-align:center;margin-bottom:80px}
.section-tag{
  display:inline-block;font-family:'JetBrains Mono',monospace;
  font-size:.75rem;color:var(--primary);letter-spacing:2px;
  padding:6px 16px;border:1px solid rgba(0,217,255,.2);
  border-radius:50px;background:rgba(0,217,255,.05);margin-bottom:16px;
}
.section-title{
  font-family:'Syne',sans-serif;
  font-size:clamp(2rem,5.5vw,3.4rem);
  font-weight:800;letter-spacing:-1px;
}

/* ========== ABOUT ========== */
.about-wrap{
  display:grid;grid-template-columns:1fr 1.2fr;gap:70px;
  align-items:center;max-width:1150px;margin:0 auto;
}
.about-visual{display:flex;justify-content:center;align-items:center;position:relative}
.blob-wrap{position:relative;width:min(420px,85vw);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.blob-glow{
  position:absolute;inset:8%;
  background:radial-gradient(circle,rgba(0,217,255,.35),rgba(168,85,247,.25) 50%,transparent 75%);
  filter:blur(40px);animation:blobGlowPulse 4s ease-in-out infinite;
}
@keyframes blobGlowPulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.blob-svg{
  width:100%;height:100%;position:relative;z-index:2;
  filter:drop-shadow(0 20px 50px rgba(0,217,255,.3));
  animation:blobMorph 12s ease-in-out infinite;
}
@keyframes blobMorph{0%,100%{transform:rotate(0deg) scale(1)}33%{transform:rotate(3deg) scale(1.03)}66%{transform:rotate(-3deg) scale(.98)}}
.blob-ring{position:absolute;inset:-6%;border-radius:50%;border:2px dashed rgba(0,217,255,.25);animation:ringSpin 25s linear infinite}
@keyframes ringSpin{to{transform:rotate(360deg)}}
.blob-orbit{position:absolute;inset:-12%;animation:ringSpin 15s linear infinite reverse}
.orbit-ball{
  position:absolute;top:50%;left:0;width:14px;height:14px;border-radius:50%;
  background:var(--primary);box-shadow:0 0 20px var(--primary),0 0 40px rgba(0,217,255,.5);
  transform:translate(-50%,-50%);
}
.visual-tag{
  position:absolute;bottom:6%;right:0;
  display:inline-flex;align-items:center;gap:10px;
  padding:11px 22px;border-radius:60px;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  color:#000;font-weight:600;font-size:.82rem;
  box-shadow:0 15px 35px rgba(0,217,255,.4);
  animation:tagFloat 3s ease-in-out infinite;z-index:5;
}
@keyframes tagFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.about-text{position:relative}
.about-line{
  font-family:'JetBrains Mono',monospace;font-size:.8rem;
  color:var(--primary);letter-spacing:2px;text-transform:uppercase;
  margin-bottom:12px;display:inline-flex;align-items:center;gap:10px;
}
.about-line::before{content:'';width:32px;height:2px;background:var(--primary)}
.about-h{
  font-family:'Syne',sans-serif;
  font-size:clamp(1.4rem,3.5vw,2rem);font-weight:700;
  margin-bottom:22px;line-height:1.25;
}
.grad-text{
  background:linear-gradient(120deg,var(--primary),var(--secondary),var(--accent));
  background-size:200% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradShift 4s linear infinite;
}
.about-text p{color:var(--muted);font-size:.98rem;line-height:1.85;margin-bottom:16px}
.about-text strong{color:var(--text);font-weight:600}
.about-info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:30px}
.info-row{
  display:flex;align-items:center;gap:14px;
  padding:15px 18px;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;
  transition:all .35s;
}
.info-row:hover{transform:translateY(-4px);border-color:var(--primary);box-shadow:0 15px 35px rgba(0,217,255,.15)}
.info-row i{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,rgba(0,217,255,.15),rgba(168,85,247,.15));
  color:var(--primary);font-size:.95rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.info-row small{display:block;font-size:.68rem;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.info-row strong{font-size:.85rem;font-weight:600;word-break:break-word}

/* ========== SERVICES ========== */
.services-grid{
  display:grid;g
